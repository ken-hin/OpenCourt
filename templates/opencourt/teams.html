{% extends 'base.html' %}
{% load static %}
{% block title %}Teams — OpenCourt{% endblock %}

{% block content %}

  <!-- Search/Filtering -->
  <div class="container mx-auto py-15">
    <div class="flex flex-col gap-4 my-7 mx-15 content-stretch">
      <!-- Search bar: Need to implement actual search functionality -->
      <div class="join flex items-center">
        <label class="input join-item grow-4">
          <input type="search" placeholder="Search" />
        </label>
        <button class="btn btn-neutral join-item grow-0">
          <i class="fa-solid fa-magnifying-glass fa-lg"></i>
        </button>
      </div>
      <!-- Conference Filter -->
    {% include 'opencourt/components/conference_filter.html' %}
    </div>
    <!-- Team Cards -->
    <div class="flex flex-wrap gap-4 justify-center">
      {% for team in team_list %}
      <a href="{% url 'opencourt:team-detail' team.slug %}" class="hover-3d team-card" id="{{ team.conference.slug }}-section">
          {% include 'opencourt/components/team_card.html' %}
      </a>
      {% endfor %}
    </div>
  </div>

  <script src="{% static 'js/conference_filter.js' %}"></script>
  <script src="{% static 'js/card_contrast.js' %}"></script>
  <style src="{% static 'css/main.css' %}"></style>

{% endblock %}

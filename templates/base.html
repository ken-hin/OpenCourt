<!--
    base.html — The shared base template for all pages in OpenCourt.

    Every page template should start with { % extends 'base.html' %} and then
    override the blocks below to inject page-specific content.

    Available blocks:
      { % block title %}     — sets the browser tab title
      { % block extra_css %} — add page-specific stylesheets in the <head>
      { % block content %}   — the main page body goes here
      { % block extra_js %}  — add page-specific scripts before </body>

    Frontend libraries:
      - Tailwind CSS + DaisyUI : compiled locally via `python manage.py tailwind start`
                                  output: theme/static/css/dist/styles.css
      - ApexCharts             : loaded via CDN (no npm integration needed)

    To change the DaisyUI color theme, edit theme/static_src/src/styles.css
    and change the theme name in the @plugin block (default: "light").
    Full theme list: https://daisyui.com/docs/themes/
-->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}OpenCourt{% endblock %}</title>

  <!-- Meta Description and Keywords -->
  <meta name="description" content="OpenCourt - College basketball statistics, rankings, and predictions. Track teams, conferences, and games with real-time data and analytics.">
  <meta name="keywords" content="college basketball, NCAA, basketball rankings, college sports, basketball statistics, basketball predictions, college teams, conferences, basketball analytics">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48dGV4dCB5PSIuOWVtIiBmb250LXNpemU9IjkwIj7wn4+APC90ZXh0Pjwvc3ZnPg==">

  {% load static %}

  <!--
      Tailwind CSS + DaisyUI — compiled from theme/static_src/src/styles.css
      by the Tailwind CLI. Run `python manage.py tailwind start` in a second
      terminal while developing to keep this file auto-updated on save.
      Run `python manage.py tailwind build` to produce a minified production build.
  -->
  <link rel="stylesheet" href="{% static 'css/dist/styles.css' %}">
  <!-- Custom styles — for anything Tailwind and DaisyUI don't cover -->
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <script src="https://kit.fontawesome.com/bd57e37b5a.js" crossorigin="anonymous"></script>

  {% block extra_css %}{% endblock %}
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar bg-opacity-0 fixed backdrop-blur-2xl px-10 shadow top-0 z-10">
    <div class="flex-1">
      <a href="{% url 'opencourt:home' %}" class="text-xl font-bold">OpenCourt</a>
    </div>
    <div class="flex gap-4">
      <a href="{% url 'opencourt:teams' %}" class="hover:text-primary">Teams</a>
      <a href="{% url 'opencourt:rankings' %}" class="hover:text-primary">Rankings</a>
      <a href="{% url 'opencourt:conferences' %}" class="hover:text-primary">Conferences</a>
      <a href="{% url 'opencourt:upcoming' %}" class="hover:text-primary">Upcoming Games</a>
      <a href="{% url 'opencourt:about' %}" class="hover:text-primary">About</a>
    </div>
  </nav>
  <!-- Main content -->
  <main class="pt-20 mx-10">
    {% block content %}{% endblock %}
  </main>

  <footer>
    <!-- Footer will be built here -->
  </footer>

  {% block extra_js %}
    <!--
      ApexCharts — an interactive chart library used for all data visualizations.
      To render a chart, target a <div id="chart"> in your template and initialize
      it in a page-specific script block. Loaded globally since most pages will
      display stats. Full docs: https://apexcharts.com/docs/installation/
    -->
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <!-- Global JS — utility functions shared across all pages -->
    <script src="{% static 'js/main.js' %}"></script>
  {% endblock %}

</body>
</html>

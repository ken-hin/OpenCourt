# pyproject.toml — Project metadata and dependency management for OpenCourt.
#
# This is the single source of truth for the project's Python dependencies.
# We use uv (https://docs.astral.sh/uv/) as our package manager.
#
# To add a new dependency:      uv add <package>
# To remove a dependency:       uv remove <package>
# To install all dependencies:  uv sync
#
# NOTE: uv.lock (the sibling file) is auto-generated by uv. It pins the exact
# versions of every package (including transitive dependencies) so that all
# teammates get identical installations. Always commit uv.lock to version control —
# never edit it by hand.

[project]
name = "opencourt"
version = "0.1.0"
description = "A free, open college basketball stats and analytics dashboard."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # Core web framework
    "django>=6.0.2",
    # Tailwind CSS integration — includes django-browser-reload for live CSS reloading in dev
    # After uv sync, run: python manage.py tailwind install
    "django-tailwind[reload]>=4.4.2",
    # CBB data API client
    "cbbd>=1.23.0",
    # HTTP requests library — used in opencourt/services.py for API calls
    "requests>=2.32.5",
    # URL-friendly slug generation (e.g. "Duke Blue Devils" -> "duke-blue-devils")
    "python-slugify>=8.0.4",
    # Add new packages below as the project grows, e.g.:
    # "whitenoise>=6.9",  # for serving static files in production (Week 7)
]

# --- Frontend Libraries ---
# Tailwind CSS and DaisyUI are compiled from theme/static_src/ — NOT loaded via CDN.
# ApexCharts is still loaded via CDN in templates/base.html (no npm package needed).
# Node.js is required to compile Tailwind. See README for setup instructions.
